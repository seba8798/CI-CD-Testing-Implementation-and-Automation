# 1. Et simpelt og præcist navn til dit workflow.
name: .NET CI Pipeline

# 2. Definerer, hvornår workflowet skal køre.
on:
  # VIGTIGT: Ret "master" til "main", hvis din hoved-branch hedder "main".
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# 3. Definerer dine jobs.
jobs:
  # Vi navngiver vores job "build-and-test".
  build-and-test:
    # 4. Angiver, at jobbet skal køre på en Ubuntu-server (hurtigere og standard).
    runs-on: windows-latest

    # 5. Her kommer de korrekte trin, korrekt placeret inde i jobbet.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Sørg for at versionen her matcher den, du bruger i dit projekt.
          dotnet-version: 8.0.x 

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --no-build --verbosity normal
